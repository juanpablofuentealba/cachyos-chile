[build]
  publish = "."

# Avisa a IndexNow (Bing/Yandex) en cada deploy de producción.
# Plugin local, sin dependencias externas.
[[plugins]]
  package = "./netlify/plugins/indexnow"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"

# El og-image casi nunca cambia: cache largo + immutable.
[[headers]]
  for = "/og-image-macul.jpg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Mapa del sitio para asistentes de IA (ChatGPT, Perplexity, Claude…).
# text/plain explícito: algunos lectores rechazan el charset por defecto.
[[headers]]
  for = "/llms.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Cache-Control = "public, max-age=3600"

# El sitemap cambia con cada guía nueva: cache corto.
[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml; charset=utf-8"
    Cache-Control = "public, max-age=3600"

# Las rutas limpias (/guias, /como-instalar-cachyos, etc.) las resuelve
# automáticamente Netlify con pretty URLs: 301 -> /ruta/ -> index.html.
# No hacen falta redirects manuales.

# ---------------------------------------------------------------------------
# DOMINIO PROPIO — juanpablomasia.cl
#
# Ya está todo preparado. Este bloque NO tiene efecto hasta que el dominio
# esté conectado en Netlify (Domain settings). Cuando esté conectado, Netlify
# sirve el dominio nuevo y redirige el .netlify.app acá automáticamente
# ("Primary domain" + redirect de dominio cansado), así que esta regla es una
# segunda red de seguridad: garantiza el 301 sin perder la ruta.
#
# Para activarlo: descomentar (quitar los '#' de las 3 líneas de abajo) y
# correr ./bin/cambiar-dominio.sh juanpablomasia.cl
#
# [[redirects]]
#   from = "https://juanpablomasia.netlify.app/*"
#   to = "https://juanpablomasia.cl/:splat"
#   status = 301
#   force = true
