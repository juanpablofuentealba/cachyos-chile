[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/og-image-macul.jpg"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[redirects]]
  from = "/guias"
  to = "/guias/index.html"
  status = 200

[[redirects]]
  from = "/como-instalar-cachyos"
  to = "/como-instalar-cachyos/index.html"
  status = 200

[[redirects]]
  from = "/linux-vs-windows"
  to = "/linux-vs-windows/index.html"
  status = 200

[[redirects]]
  from = "/revivir-pc-viejo-con-linux"
  to = "/revivir-pc-viejo-con-linux/index.html"
  status = 200
